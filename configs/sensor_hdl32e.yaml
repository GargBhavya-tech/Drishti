n_beams: 32
d_theta_deg: 0.3333
d_theta_rad: 0.005818145080604945

d_phi_deg: 1.3335
d_phi_rad: 0.023273959697808403

phi_max_deg: 10.0
h_m: 1.84                    # TODO: replace with the measured value from Ticket #7
                              # (calibrated_sensor table + ground-plane fit cross-check).
